x-service: &service
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - services

services:
  rabbitmq:
    <<: *service
    build: ./RabbitMQ
    env_file: ./RabbitMQ/.env
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    <<: *service
    build: ./Backend
    image: harvest-backend
    env_file: ./Backend/.env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *service
    build: ./Backend
    image: harvest-backend
    env_file: ./Backend/.env
    command: ["celery", "-A", "project", "worker",
              "--loglevel=INFO", "--queues=harvesting", "--concurrency=2"]

  cron:
    <<: *service
    build: ./Cron
    env_file: ./Cron/.env
    cap_drop: []
    cap_add:
      - SETUID
      - SETGID

  frontend:
    <<: *service
    build:
      context: ./Frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    env_file: ./Frontend/.env
    ports:
      - "127.0.0.1:3000:3000"

networks:
  services:
    driver: bridge

volumes:
  rabbitmq_data:
